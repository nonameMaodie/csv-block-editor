<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: var(--vscode-editor-background, #f5f5f5);
            color: var(--vscode-editor-foreground, #333);
            overflow: hidden;
        }

        .table-wrapper {
            overflow: auto;
            height: 100vh;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            padding: 6px 8px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 120px;
            max-width: 300px;
            border-bottom: 1px solid #3c3c3c;
            border-right: 1px solid #3c3c3c;
        }

        th {
            background-color: #2d3134;
        }

        thead tr:first-child th {
            border-top: 1px solid #3c3c3c;
        }

        th:first-child,
        td:first-child {
            border-left: 1px solid #3c3c3c;
        }

        thead tr:first-child th {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead tr.type-row th {
            position: sticky;
            z-index: 10;
        }

        tbody td:first-child {
            position: sticky;
            left: 0;
            z-index: 5;
            background-color: #1e1e1e;
        }

        thead th:first-child {
            position: sticky;
            left: 0;
            z-index: 20;
        }

        thead tr:first-child th:first-child {
            z-index: 20;
        }

        thead tr.type-row th:first-child {
            z-index: 20;
        }

        .type-row th {
            background-color: #222526;
            font-weight: normal;
            font-size: 0.85em;
            color: #999;
        }

        .type-header {
            cursor: help;
        }

        tbody tr:nth-child(even) {
            background-color: #2a2d2e;
        }

        tbody tr:nth-child(even) td:first-child {
            background-color: #2a2d2e;
        }

        tr.highlighted {
            background-color: #4a4d30 !important;
        }

        tr.highlighted td:first-child {
            background-color: #4a4d30 !important;
        }

        .edit-cell {
            width: 120px;
            outline: none;
        }

        .edit-cell:focus {
            outline: 2px solid var(--vscode-focusBorder, #007fd4);
            outline-offset: -2px;
            background-color: #4a4d30 !important;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background-color: #4caf50;
            color: white;
        }

        .toast.error {
            background-color: #f44336;
            color: white;
        }

        .col-resize-handle {
            position: absolute;
            right: -3px;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            z-index: 30;
        }

        .col-resize-handle:hover,
        .col-resize-handle.active {
            background-color: var(--vscode-focusBorder, #007fd4);
        }

        .search-bar {
            position: fixed;
            top: 0;
            right: 20px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            background-color: #2d3134;
            border: 1px solid #3c3c3c;
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 6px 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .search-bar.visible {
            display: flex;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .search-row+.search-row {
            margin-top: 4px;
        }

        .search-bar input {
            width: 220px;
            padding: 4px 8px;
            border: 1px solid #555;
            border-radius: 3px;
            background-color: #1e1e1e;
            color: #ccc;
            font-size: 13px;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--vscode-focusBorder, #007fd4);
        }

        .search-bar button {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 4px 6px;
            font-size: 14px;
            border-radius: 3px;
            line-height: 1;
        }

        .search-bar button:hover {
            background-color: #3c3c3c;
        }

        .search-bar button:disabled {
            color: #555;
            cursor: default;
        }

        .search-bar button:disabled:hover {
            background-color: transparent;
        }

        .search-bar .search-count {
            font-size: 12px;
            color: #999;
            min-width: 60px;
            text-align: center;
            user-select: none;
        }

        .search-bar .search-close {
            font-size: 16px;
            margin-left: 2px;
        }

        .search-bar .toggle-replace {
            font-size: 13px;
            padding: 4px 5px;
        }

        .replace-row {
            display: none;
        }

        .replace-row.visible {
            display: flex;
        }

        td.search-match {
            background-color: #6b4c00 !important;
            color: #fff !important;
        }

        td.search-current {
            background-color: #a67c00 !important;
            outline: 2px solid #d4a017 !important;
            outline-offset: -2px;
        }
    </style>
</head>

<body>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="headerRow"></tr>
                <tr class="type-row" id="typeRow"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="toast" class="toast"></div>

    <div id="searchBar" class="search-bar">
        <div class="search-row">
            <button id="toggleReplace" class="toggle-replace" title="切换替换">&#9654;</button>
            <input type="text" id="searchInput" placeholder="搜索..." />
            <span id="searchCount" class="search-count"></span>
            <button id="searchPrev" title="上一个 (Shift+Enter)">&#9650;</button>
            <button id="searchNext" title="下一个 (Enter)">&#9660;</button>
            <button id="searchClose" class="search-close" title="关闭 (Esc)">&times;</button>
        </div>
        <div id="replaceRow" class="search-row replace-row">
            <span style="width:21px"></span>
            <input type="text" id="replaceInput" placeholder="替换..." />
            <button id="replaceOne" title="替换 (Ctrl+Shift+1)">&#8625;</button>
            <button id="replaceAll" title="全部替换 (Ctrl+Shift+2)">&#8625;&#8625;</button>
        </div>
    </div>

            'DefaultDescription': '默认描述',
            '': '空列',
        };

        const typeMapping = {
            'Class Name': 'string',
            'DefaultDisplayName': 'string',
            'DefaultCategory': 'string',
            'Behaviors': 'string',
            'DisplayOrder': 'int',
            'DefaultIconBlockOffset': 'Vector3',
            'DefaultIconViewOffset': 'Vector3',
            'DefaultIconViewScale': 'float',
            'FirstPersonScale': 'float',
            'FirstPersonOffset': 'Vector3',
            'FirstPersonRotation': 'Vector3',
            'InHandScale': 'float',
            'InHandOffset': 'Vector3',
            'InHandRotation': 'Vector3',
            'CraftingId': 'string',
            'DefaultCreativeData': 'int',
            'IsCollidable': 'bool',
            'IsPlaceable': 'bool',
            'IsDiggingTransparent': 'bool',
            'IsPlacementTransparent': 'bool',
            'DefaultIsInteractive': 'bool',
            'IsEditable': 'bool',
            'IsNonDuplicable': 'bool',
            'IsGatherable': 'bool',
            'HasCollisionBehavior': 'bool',
            'KillsWhenStuck': 'bool',
            'IsFluidBlocker': 'bool',
            'IsTransparent': 'bool',
            'GenerateFacesForSameNeighbors': 'bool',
            'DefaultShadowStrength': 'int',
            'LightAttenuation': 'int',
            'DefaultEmittedLightAmount': 'int',
            'ObjectShadowStrength': 'float',
            'DefaultDropContent': 'string',
            'DefaultDropCount': 'float',
            'DefaultExperienceCount': 'float',
            'RequiredToolLevel': 'int',
            'MaxStacking': 'int',
            'SleepSuitability': 'float',
            'FrictionFactor': 'float',
            'Density': 'float',
            'NoAutoJump': 'bool',
            'NoSmoothRise': 'bool',
            'FuelHeatLevel': 'int',
            'FuelFireDuration': 'float',
            'DefaultSoundMaterialName': 'string',
            'ShovelPower': 'float',
            'QuarryPower': 'float',
            'HackPower': 'float',
            'DefaultMeleePower': 'float',
            'DefaultMeleeHitProbability': 'float',
            'DefaultProjectilePower': 'float',
            'ToolLevel': 'int',
            'PlayerLevelRequired': 'int',
            'Durability': 'int',
            'IsAimable': 'bool',
            'IsStickable': 'bool',
            'AlignToVelocity': 'bool',
            'ProjectileSpeed': 'float',
            'ProjectileDamping': 'float',
            'ProjectileTipOffset': 'float',
            'DisintegratesOnHit': 'bool',
            'ProjectileStickProbability': 'float',
            'DefaultHeat': 'float',
            'FireDuration': 'float',
            'ExplosionResilience': 'float',
            'DefaultExplosionPressure': 'float',
            'DefaultExplosionIncendiary': 'bool',
            'ExplosionKeepsPickables': 'bool',
            'DigMethod': 'BlockDigMethod',
            'DigResilience': 'float',
            'ProjectileResilience': 'float',
            'DefaultNutritionalValue': 'float',
            'DefaultSicknessProbability': 'float',
            'FoodType': 'FoodType',
            'DefaultRotPeriod': 'int',
            'DefaultTextureSlot': 'int',
            'DestructionDebrisScale': 'float',
            'DefaultDescription': 'string'
        };

        const typeDescriptions = {
            'bool': 'TRUE（是）、FALSE（否）',
            'int': '-2147483648 到 2147483647的整数，或Infinity(无穷大)',
            'float': '±3.40282 * 10^38之间的整数和小数，或Infinity(无穷大)',
            'string': '任意文本，除了";"',
            'Vector3': '逗号分隔的三个float(浮点数)',
            'BlockDigMethod': 'None(无)、Shovel(铲子)、Quarry(镐子)、Hack(斧头)',
            'FoodType': 'None(无)、Meat(肉)、Fish(鱼肉)、Fruit(水果)、Grass(草)、Bread(面包)'
        };

        let csvData = [];
        let headers = [];
        let updateTimer = null;
        let toastTimer = null;
        let tableInitialized = false;
        let undoStack = [];
        let redoStack = [];
        const MAX_UNDO = 100;

        function initializeTable(content, fileName) {
            try {
                csvData = parseCSV(content);
                if (csvData.length === 0) { return; }
                headers = [...csvData[0]];
                vscode.setState({ content, fileName });
                renderTable();
                if (!tableInitialized) {
                    setupEventDelegation();
                    setupColumnResize();
                    tableInitialized = true;
                }
            } catch (error) {
                showToast('解析文件时出错: ' + error.message, false);
            }
        }

        const savedState = vscode.getState();
        if (savedState && savedState.content) {
            initializeTable(savedState.content, savedState.fileName || '');
        }
        vscode.postMessage({ type: 'requestInit' });

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (isSuccess ? 'success' : 'error');

            if (toastTimer) { clearTimeout(toastTimer); }

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const result = [];

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;

                const row = [];
                let current = '';
                let inQuotes = false;

                for (let j = 0; j < lines[i].length; j++) {
                    const char = lines[i][j];

                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ';' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                result.push(row);
            }
            return result;
        }

        function convertToCSV(data) {
            return data.map(row =>
                row.map(field => {
                    if (field.includes(';') || field.includes('"') || field.includes('\n')) {
                        return '"' + field.replace(/"/g, '""') + '"';
                    }
                    return field;
                }).join(';')
            ).join('\n');
        }

        function renderTable() {
            if (csvData.length === 0) { return; }

            const headerRow = document.getElementById('headerRow');
            const typeRow = document.getElementById('typeRow');
            const tableBody = document.getElementById('tableBody');

            let headerHtml = '';
            let typeHtml = '';

            for (let j = 0; j < csvData[0].length; j++) {
                const header = csvData[0][j];
                const chineseHeader = fieldMapping[header] || header;
                headerHtml += `<th title="${header}"><span>${chineseHeader}</span><div class="col-resize-handle" data-col="${j}"></div></th>`;

                const dataType = typeMapping[header] || '';
                typeHtml += `<th class="type-header" title="${typeDescriptions[dataType] ?? ''}">${dataType}</th>`;
            }

            headerRow.innerHTML = headerHtml;
            typeRow.innerHTML = typeHtml;

            let bodyHtml = '';

            for (let i = 1; i < csvData.length; i++) {
                bodyHtml += '<tr>';
                for (let j = 0; j < csvData[i].length; j++) {
                    const cellValue = j < csvData[i].length ? csvData[i][j] : '';
                    bodyHtml += `<td class="edit-cell" contenteditable="true"
                                 data-row="${i}" data-col="${j}">${escapeHtml(cellValue)}</td>`;
                }
                bodyHtml += '</tr>';
            }

            tableBody.innerHTML = bodyHtml;

            requestAnimationFrame(() => {
                const firstHeaderRow = document.querySelector('thead tr:first-child');
                const typeRowCells = document.querySelectorAll('thead tr.type-row th');
                if (firstHeaderRow && typeRowCells.length > 0) {
                    const firstRowHeight = firstHeaderRow.getBoundingClientRect().height;
                    typeRowCells.forEach(th => {
                        th.style.top = firstRowHeight + 'px';
                    });
                }
            });
        }

        function setupEventDelegation() {
            const tableBody = document.getElementById('tableBody');

            tableBody.addEventListener('focusin', function (e) {
                const cell = e.target;
                if (cell.classList && cell.classList.contains('edit-cell')) {
                    highlightRow(cell);
                }
            });

            tableBody.addEventListener('focusout', function (e) {
                const cell = e.target;
                if (cell.classList && cell.classList.contains('edit-cell')) {
                    onCellBlur(cell);
                }
            });
        }

        function setupColumnResize() {
            const headerRow = document.getElementById('headerRow');
            let resizing = false;
            let startX = 0;
            let startWidth = 0;
            let resizeHandle = null;
            let resizeTh = null;

            headerRow.addEventListener('mousedown', function (e) {
                const handle = e.target.closest('.col-resize-handle');
                if (!handle) { return; }

                e.preventDefault();
                resizing = true;
                resizeHandle = handle;
                resizeTh = handle.parentElement;
                startX = e.clientX;
                startWidth = resizeTh.offsetWidth;
                handle.classList.add('active');

                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', function (e) {
                if (!resizing) { return; }

                const diff = e.clientX - startX;
                const newWidth = Math.max(60, startWidth + diff);
                const colIdx = parseInt(resizeHandle.dataset.col);

                resizeTh.style.width = newWidth + 'px';
                resizeTh.style.minWidth = newWidth + 'px';
                resizeTh.style.maxWidth = newWidth + 'px';

                const allCells = document.querySelectorAll(`td[data-col="${colIdx}"]`);
                allCells.forEach(cell => {
                    cell.style.width = newWidth + 'px';
                    cell.style.minWidth = newWidth + 'px';
                    cell.style.maxWidth = newWidth + 'px';
                });

                const typeTh = document.querySelectorAll('.type-row th')[colIdx];
                if (typeTh) {
                    typeTh.style.width = newWidth + 'px';
                    typeTh.style.minWidth = newWidth + 'px';
                    typeTh.style.maxWidth = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', function () {
                if (!resizing) { return; }

                resizing = false;
                if (resizeHandle) {
                    resizeHandle.classList.remove('active');
                }
                resizeHandle = null;
                resizeTh = null;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightRow(cell) {
            const highlightedRows = document.querySelectorAll('tr.highlighted');
            highlightedRows.forEach(row => row.classList.remove('highlighted'));

            const row = cell.closest('tr');
            if (row) {
                row.classList.add('highlighted');
            }
        }

        function removeHighlight(cell) {
            const row = cell.closest('tr');
            if (row) {
                row.classList.remove('highlighted');
            }
        }

        function onCellBlur(cell) {
            const rowIdx = parseInt(cell.dataset.row);
            const colIdx = parseInt(cell.dataset.col);
            const value = cell.textContent;

            removeHighlight(cell);
            updateCellValue(rowIdx, colIdx, value);
        }

        function pushUndo(entry) {
            undoStack.push(entry);
            if (undoStack.length > MAX_UNDO) {
                undoStack.shift();
            }
            redoStack = [];
        }

        function updateCellValue(rowIdx, colIdx, value) {
            if (rowIdx < csvData.length && colIdx < csvData[rowIdx].length) {
                if (csvData[rowIdx][colIdx] === value) {
                    return;
                }
                pushUndo({ row: rowIdx, col: colIdx, oldValue: csvData[rowIdx][colIdx], newValue: value });
                csvData[rowIdx][colIdx] = value;
            } else if (rowIdx < csvData.length) {
                for (let i = csvData[rowIdx].length; i <= colIdx; i++) {
                    csvData[rowIdx].push('');
                }
                pushUndo({ row: rowIdx, col: colIdx, oldValue: '', newValue: value });
                csvData[rowIdx][colIdx] = value;
            }

            notifyUpdate();
        }

        function notifyUpdate() {
            if (updateTimer) {
                clearTimeout(updateTimer);
            }
            updateTimer = setTimeout(() => {
                const csvContent = convertToCSV(csvData);
                vscode.postMessage({
                    type: 'update',
                    content: csvContent
                });
            }, 300);
        }

        function saveCSV() {
            if (csvData.length === 0) {
                showToast('没有数据可保存', false);
                return;
            }

            try {
                const csvContent = convertToCSV(csvData);
                vscode.postMessage({
                    type: 'save',
                    content: csvContent
                });
            } catch (error) {
                showToast('保存失败: ' + error.message, false);
            }
        }

        function handleFileChanged(newContent) {
            const currentContent = convertToCSV(csvData);
            if (newContent === currentContent) {
                return;
            }

            const scrollContainer = document.querySelector('.table-wrapper');
            const scrollTop = scrollContainer.scrollTop;
            const scrollLeft = scrollContainer.scrollLeft;

            let focusInfo = null;
            const activeCell = document.activeElement;
            if (activeCell && activeCell.classList.contains('edit-cell')) {
                focusInfo = {
                    row: parseInt(activeCell.dataset.row),
                    col: parseInt(activeCell.dataset.col)
                };
            }

            try {
                csvData = parseCSV(newContent);
                if (csvData.length === 0) { return; }
                headers = [...csvData[0]];
                renderTable();

                scrollContainer.scrollTop = scrollTop;
                scrollContainer.scrollLeft = scrollLeft;

                if (focusInfo) {
                    const cell = document.querySelector(
                        `td[data-row="${focusInfo.row}"][data-col="${focusInfo.col}"]`
                    );
                    if (cell) { cell.focus(); }
                }

                showToast('文件已从外部更新');
            } catch (error) {
                showToast('同步外部变更出错: ' + error.message, false);
            }
        }

        window.addEventListener('message', event => {
            const msg = event.data;
            if (msg.type === 'init') {
                initializeTable(msg.content, msg.fileName);
            } else if (msg.type === 'fileChanged') {
                handleFileChanged(msg.content);
            } else if (msg.type === 'saveResult') {
                if (msg.success) {
                    showToast('已保存');
                } else {
                    showToast('保存失败', false);
                }
            }
        });

        let searchMatches = [];
        let searchCurrentIndex = -1;
        let replaceVisible = false;

        function openSearch() {
            const searchBar = document.getElementById('searchBar');
            const searchInput = document.getElementById('searchInput');
            searchBar.classList.add('visible');
            searchInput.focus();
            searchInput.select();
        }

        function closeSearch() {
            const searchBar = document.getElementById('searchBar');
            searchBar.classList.remove('visible');
            clearSearchHighlights();
            searchMatches = [];
            searchCurrentIndex = -1;
        }

        function toggleReplace() {
            replaceVisible = !replaceVisible;
            const replaceRow = document.getElementById('replaceRow');
            const toggleBtn = document.getElementById('toggleReplace');
            if (replaceVisible) {
                replaceRow.classList.add('visible');
                toggleBtn.innerHTML = '&#9660;';
            } else {
                replaceRow.classList.remove('visible');
                toggleBtn.innerHTML = '&#9654;';
            }
        }

        function clearSearchHighlights() {
            document.querySelectorAll('td.search-match, td.search-current').forEach(td => {
                td.classList.remove('search-match', 'search-current');
            });
            document.getElementById('searchCount').textContent = '';
        }

        function performSearch() {
            clearSearchHighlights();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                searchMatches = [];
                searchCurrentIndex = -1;
                return;
            }

            const lowerQuery = query.toLowerCase();
            searchMatches = [];

            document.querySelectorAll('#tableBody td.edit-cell').forEach(td => {
                const text = td.textContent.toLowerCase();
                if (text.includes(lowerQuery)) {
                    td.classList.add('search-match');
                    searchMatches.push(td);
                }
            });

            const countEl = document.getElementById('searchCount');
            if (searchMatches.length > 0) {
                searchCurrentIndex = 0;
                searchMatches[0].classList.add('search-current');
                searchMatches[0].scrollIntoView({ block: 'center', inline: 'center' });
                countEl.textContent = '1 / ' + searchMatches.length;
            } else {
                searchCurrentIndex = -1;
                countEl.textContent = '无结果';
            }
        }

        function navigateSearch(direction) {
            if (searchMatches.length === 0) { return; }

            if (searchCurrentIndex >= 0 && searchCurrentIndex < searchMatches.length) {
                searchMatches[searchCurrentIndex].classList.remove('search-current');
            }

            if (direction === 'next') {
                searchCurrentIndex = (searchCurrentIndex + 1) % searchMatches.length;
            } else {
                searchCurrentIndex = (searchCurrentIndex - 1 + searchMatches.length) % searchMatches.length;
            }

            searchMatches[searchCurrentIndex].classList.add('search-current');
            searchMatches[searchCurrentIndex].scrollIntoView({ block: 'center', inline: 'center' });

            document.getElementById('searchCount').textContent = (searchCurrentIndex + 1) + ' / ' + searchMatches.length;
        }

        function replaceCurrentMatch() {
            if (searchMatches.length === 0 || searchCurrentIndex < 0) { return; }

            const query = document.getElementById('searchInput').value;
            const replacement = document.getElementById('replaceInput').value;
            const cell = searchMatches[searchCurrentIndex];
            const rowIdx = parseInt(cell.dataset.row);
            const colIdx = parseInt(cell.dataset.col);

            const oldText = csvData[rowIdx][colIdx];
            const lowerOld = oldText.toLowerCase();
            const lowerQuery = query.toLowerCase();
            const idx = lowerOld.indexOf(lowerQuery);
            if (idx === -1) { return; }

            const newText = oldText.substring(0, idx) + replacement + oldText.substring(idx + query.length);
            pushUndo({ row: rowIdx, col: colIdx, oldValue: oldText, newValue: newText });
            csvData[rowIdx][colIdx] = newText;
            cell.textContent = newText;
            notifyUpdate();

            performSearch();
        }

        function replaceAllMatches() {
            if (searchMatches.length === 0) { return; }

            const query = document.getElementById('searchInput').value;
            const replacement = document.getElementById('replaceInput').value;
            const lowerQuery = query.toLowerCase();
            let count = 0;
            const batchOld = [];

            const processed = new Set();
            searchMatches.forEach(cell => {
                const rowIdx = parseInt(cell.dataset.row);
                const colIdx = parseInt(cell.dataset.col);
                const key = rowIdx + ',' + colIdx;
                if (processed.has(key)) { return; }
                processed.add(key);

                const oldText = csvData[rowIdx][colIdx];
                const lowerOld = oldText.toLowerCase();
                if (!lowerOld.includes(lowerQuery)) { return; }

                let newText = '';
                let i = 0;
                while (i < oldText.length) {
                    if (oldText.substring(i).toLowerCase().startsWith(lowerQuery)) {
                        newText += replacement;
                        i += query.length;
                        count++;
                    } else {
                        newText += oldText[i];
                        i++;
                    }
                }
                batchOld.push({ row: rowIdx, col: colIdx, oldValue: oldText, newValue: newText });
                csvData[rowIdx][colIdx] = newText;
                cell.textContent = newText;
            });

            if (batchOld.length > 0) {
                pushUndo({ type: 'batch', changes: batchOld });
            }

            notifyUpdate();
            performSearch();
            showToast('已替换 ' + count + ' 处');
        }

        function applyCellChange(rowIdx, colIdx, value) {
            csvData[rowIdx][colIdx] = value;
            const cell = document.querySelector(`td[data-row="${rowIdx}"][data-col="${colIdx}"]`);
            if (cell) {
                cell.textContent = value;
            }
        }

        function undo() {
            if (undoStack.length === 0) { return; }
            const entry = undoStack.pop();

            if (entry.type === 'batch') {
                const redoChanges = [];
                for (let i = entry.changes.length - 1; i >= 0; i--) {
                    const c = entry.changes[i];
                    redoChanges.push({ row: c.row, col: c.col, oldValue: c.newValue, newValue: c.oldValue });
                    applyCellChange(c.row, c.col, c.oldValue);
                }
                redoStack.push({ type: 'batch', changes: redoChanges });
            } else {
                applyCellChange(entry.row, entry.col, entry.oldValue);
                redoStack.push({ row: entry.row, col: entry.col, oldValue: entry.newValue, newValue: entry.oldValue });
            }

            notifyUpdate();
        }

        function redo() {
            if (redoStack.length === 0) { return; }
            const entry = redoStack.pop();

            if (entry.type === 'batch') {
                const undoChanges = [];
                for (let i = entry.changes.length - 1; i >= 0; i--) {
                    const c = entry.changes[i];
                    undoChanges.push({ row: c.row, col: c.col, oldValue: c.newValue, newValue: c.oldValue });
                    applyCellChange(c.row, c.col, c.oldValue);
                }
                undoStack.push({ type: 'batch', changes: undoChanges });
            } else {
                applyCellChange(entry.row, entry.col, entry.oldValue);
                undoStack.push({ row: entry.row, col: entry.col, oldValue: entry.newValue, newValue: entry.oldValue });
            }

            notifyUpdate();
        }

        document.getElementById('toggleReplace').addEventListener('click', toggleReplace);

        document.getElementById('searchInput').addEventListener('input', performSearch);

        document.getElementById('searchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigateSearch(e.shiftKey ? 'prev' : 'next');
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeSearch();
            }
        });

        document.getElementById('replaceInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                replaceCurrentMatch();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeSearch();
            }
        });

        document.getElementById('searchNext').addEventListener('click', function () {
            navigateSearch('next');
        });

        document.getElementById('searchPrev').addEventListener('click', function () {
            navigateSearch('prev');
        });

        document.getElementById('searchClose').addEventListener('click', closeSearch);

        document.getElementById('replaceOne').addEventListener('click', replaceCurrentMatch);

        document.getElementById('replaceAll').addEventListener('click', replaceAllMatches);

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
                return;
            }

            if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                e.preventDefault();
                redo();
                return;
            }

            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                openSearch();
            }

            if ((e.ctrlKey || e.metaKey) && e.key === 'h') {
                e.preventDefault();
                openSearch();
                if (!replaceVisible) {
                    toggleReplace();
                }
                document.getElementById('replaceInput').focus();
            }

            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveCSV();
            }

            if (e.key === 'Tab') {
                const cell = e.target;
                if (cell.classList && cell.classList.contains('edit-cell')) {
                    e.preventDefault();
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    const maxCol = csvData[0] ? csvData[0].length - 1 : 0;

                    let nextRow = row;
                    let nextCol;

                    if (e.shiftKey) {
                        nextCol = col - 1;
                        if (nextCol < 0) {
                            nextCol = maxCol;
                            nextRow = row - 1;
                        }
                    } else {
                        nextCol = col + 1;
                        if (nextCol > maxCol) {
                            nextCol = 0;
                            nextRow = row + 1;
                        }
                    }

                    const nextCell = document.querySelector(`td[data-row="${nextRow}"][data-col="${nextCol}"]`);
                    if (nextCell) {
                        nextCell.focus();
                    }
                }
            }

            if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
                const cell = e.target;
                if (cell.classList && cell.classList.contains('edit-cell')) {
                    e.preventDefault();
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);

                    const nextRow = e.shiftKey ? row - 1 : row + 1;
                    const nextCell = document.querySelector(`td[data-row="${nextRow}"][data-col="${col}"]`);
                    if (nextCell) {
                        nextCell.focus();
                    }
                }
            }
        });
    </script>
</body>
